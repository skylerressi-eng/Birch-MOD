org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# ---------------------------------------------------------------------------
# Which Minecraft this builds for.
#
# Set by ./switch-mc, which also moves the Gradle wrapper — Loom's version is
# tied to the game version and Gradle's is tied to Loom's, so these cannot be
# edited one at a time. The profiles live in versions/.
#
#   ./switch-mc 26.2
#   ./switch-mc 26.1.2
#
# Minecraft 26.1+ requires Java 25 for the Gradle JVM either way.
#
# Nothing else needs changing: build.gradle reads minecraft_version and
# compiles the matching compat source set (src/mc26_1 or src/mc26_2).
# ---------------------------------------------------------------------------
# >>> target
minecraft_version=26.2
loader_version=0.19.5
fabric_version=0.161.0+26.2
loom_version=1.18.2
# <<< target

mod_version=2.2.0
maven_group=com.birchmod
archives_base_name=birchoptimizer

# Test framework.
junit_version=5.11.4
